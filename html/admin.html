                                                "on-secondary-container": "#4f4600",
                                                "secondary": "#e6d02d",
                                                "secondary-fixed-dim": "#dec823",
                                                "secondary-fixed": "#fbe442",
                                                "on-primary-container": "#716400",
                                                "on-tertiary-fixed-variant": "#49473b",
                                                "inverse-on-surface": "#333025",
                                                "surface-container-highest": "#373529",
                                                "on-error-container": "#ffdad6",
                                                "on-surface": "#e8e2d1",

<body class="bg-background text-on-background font-body-lg overflow-hidden">
        <!-- Cinematic Background Container -->
        <div class="fixed inset-0 z-0">
                <div class="absolute inset-0 bg-black/60 z-10"></div>
                <img alt="High-performance gym" class="w-full h-full object-cover"
                        data-alt="A cinematic, low-angle shot of a high-end luxury fitness facility with sleek black equipment and dramatic neon gold lighting accents. The atmosphere is moody and focused, with steam rising in the background and a shallow depth of field highlighting professional training gear. The visual style is premium and dark, utilizing deep graphite tones and vibrant golden highlights to create an elite, near-spiritual atmosphere for high-performance training."
                        src="https://lh3.googleusercontent.com/aida-public/AB6AXuBberhrn5YMpULizP4N4lRNJyCRODvMwX9e04nf4EqBoPc6Dlak2PiyL4l9BkQLoRl5--4b7qihUAzs9O3MAxf5l1_495KY88-0SSMMtV0cC384E4QTPhShvoaEZOiwaboypV-aXGJvRs3tjnmm12B-gJ_PO4q2M-2F2ZYViaPU7UFp82ytfQDLZPqr1QFZbX8CS2Oq5BH18L4vCNwAEHphr8yyY_-u7uJ1x0b5Of808hrkDw3OPk8LLYy7T10KaBh5rqKDV_ZUNoI">
        </div>
        <!-- Top Navigation Shell -->
        <header
                class="fixed top-0 w-full bg-transparent flex justify-between items-center px-margin-mobile md:px-margin-desktop h-20 z-50">
                <div class="tracking-tighter"><img alt="The Dream Gym Logo" class="h-12 w-auto object-contain"
                                src="/images/logo.png"></div>
                <nav class="flex items-center gap-8">
                        <a class="text-on-surface-variant font-body-lg text-body-lg hover:text-secondary transition-colors duration-300"
                                href="/">THE DREAM GYM</a>
                </nav>
        </header>
        <!-- Main Login Canvas -->
        <main class="relative z-20 min-h-screen flex items-center justify-center px-margin-mobile">
                <div class="w-full max-w-md">
                        <!-- Glassmorphism Card -->
                        <div
                                class="bg-surface-container/60 backdrop-blur-custom border border-outline-variant/30 rounded-xl p-10 md:p-12 shadow-2xl">
                                <!-- Brand Header -->
                                <div class="text-center mb-10">
                                        <div class="flex items-center justify-center mb-6">
                                                <img src="/images/logo.png" alt="Logo" class="h-16 w-auto object-contain">
                                        </div>
                                        <h1
                                                class="font-headline-md text-headline-md text-on-surface tracking-tight mb-2">
                                                ADMINISTRATION</h1>
                                        <p
                                                class="font-body-sm text-body-sm text-on-surface-variant opacity-80 uppercase tracking-widest">
                                                Enter your credentials to access the command center.</p>
                                </div>
                                <!-- Login Form -->
                                <form id="login-form" class="space-y-6">
                                        <div class="space-y-2">
                                                <label class="font-label-caps text-label-caps text-on-surface-variant"
                                                        for="email">Email Address</label>
                                                <div class="relative">
                                                        <input class="w-full bg-surface-container-highest/50 border-b border-outline-variant focus:border-secondary focus:ring-0 text-on-surface py-3 px-0 transition-all duration-300 outline-none placeholder:text-on-surface-variant/40"
                                                                id="email" placeholder="thedreamgym" type="text">
                                                </div>
                                        </div>
                                        <div class="space-y-2">
                                                <div class="flex justify-between items-center">
                                                        <label class="font-label-caps text-label-caps text-on-surface-variant"
                                                                for="password">Password</label>
                                                        <a class="font-label-caps text-label-caps text-secondary hover:underline"
                                                                href="#"></a>
                                                </div>
                                                <div class="relative">
                                                        <input class="w-full bg-surface-container-highest/50 border-b border-outline-variant focus:border-secondary focus:ring-0 text-on-surface py-3 px-0 transition-all duration-300 outline-none placeholder:text-on-surface-variant/40"
                                                                id="password" placeholder="••••••••" type="password">
                                                        <button id="toggle-password"
                                                                class="absolute right-0 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-secondary transition-colors"
                                                                type="button">
                                                                <span
                                                                        class="material-symbols-outlined text-xl">visibility</span>
                                                        </button>
                                                </div>
                                        </div>
                                        <div class="pt-4">
                                                <button class="w-full bg-secondary text-on-secondary font-display-lg text-body-lg font-extrabold py-4 rounded-lg hover:shadow-[0_0_20px_rgba(230,208,45,0.4)] transform active:scale-[0.98] transition-all duration-300 uppercase tracking-widest"
                                                        type="submit">
                                                        SECURE LOGIN
                                                </button>
                                        </div>
                                </form>
                                <!-- Status Decor -->
                                <div class="mt-8 flex items-center justify-center gap-2">
                                        <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"
                                                style="box-shadow: 0 0 10px rgba(34, 197, 94, 0.8);"></div>
                                        <span class="font-label-caps text-label-caps text-on-surface-variant">SYSTEMS
                                                SECURED &amp; READY<br></span>
                                </div>
                        </div>
                </div>
        </main>
        <!-- Footer Shell -->
        <footer
                class="fixed bottom-0 w-full bg-transparent flex flex-col md:flex-row justify-between items-center px-margin-mobile md:px-margin-desktop py-8 z-40">
                <div class="font-body-sm text-body-sm text-on-surface-variant mb-4 md:mb-0">
                        &copy; 2026 THE DREAM GYM. DESIGNED BY AS CREATES</div>
                <div class="flex gap-6">
                        <a class="font-body-sm text-body-sm text-on-surface-variant hover:text-secondary underline transition-all"
                                href="https://wa.me/918328929165" target="_blank" rel="noopener noreferrer">Whatsapp</a>
                        <a class="font-body-sm text-body-sm text-on-surface-variant hover:text-secondary underline transition-all"
                                href="https://www.facebook.com/people/The-Dream-Gym/61557587000859/?_rdr" target="_blank"
                                rel="noopener noreferrer">Facebook</a>
                        <a class="font-body-sm text-body-sm text-on-surface-variant hover:text-secondary underline transition-all"
                                href="https://www.instagram.com/thedreamgym24?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw=="
                                target="_blank" rel="noopener noreferrer">Instagram</a>
                </div>
        </footer>


        <script src="/admin.js"></script>
</body>

</html>
