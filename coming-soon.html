<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - The Dream Gym</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-background: #15130a;
            --color-surface: #222015;
            --color-secondary: #e6d02d;
            --color-outline: #4b4734;
            --color-on-surface: #e8e2d1;
            --color-on-surface-variant: #cdc7ad;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Epilogue', sans-serif;
            background-color: var(--color-background);
            color: var(--color-on-surface);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Responsive Video Wrapper */
        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            background: var(--color-background);
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Overlay to make text readable */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(21, 19, 10, 0.92) 0%, rgba(21, 19, 10, 0.8) 50%, rgba(34, 32, 21, 0.88) 100%);
            z-index: 2;
        }

        /* Coming Soon Card */
        .coming-soon-card {
            position: relative;
            z-index: 3;
            max-width: 500px;
            width: 90%;
            background: rgba(34, 32, 21, 0.75);
            backdrop-filter: blur(16px) saturate(120%);
            -webkit-backdrop-filter: blur(16px) saturate(120%);
            border: 1px solid rgba(75, 71, 52, 0.4);
            padding: 48px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(230, 208, 45, 0.05);
            animation: cardFadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .rocket-icon {
            font-size: 54px;
            color: var(--color-secondary);
            margin-bottom: 24px;
            display: inline-flex;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 16px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            color: var(--color-on-surface-variant);
            margin-bottom: 30px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(230, 208, 45, 0.1);
            border: 1px solid rgba(230, 208, 45, 0.3);
            padding: 8px 16px;
            border-radius: 9999px;
            color: var(--color-secondary);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--color-secondary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--color-secondary);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        .footer-text {
            margin-top: 36px;
            font-size: 12px;
            color: rgba(205, 199, 173, 0.4);
            border-top: 1px solid rgba(75, 71, 52, 0.2);
            padding-top: 24px;
        }

        .footer-text a {
            color: var(--color-secondary);
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div id="video-wrapper" class="video-wrapper">
        <video id="maintenance-video" autoplay loop muted playsinline></video>
        <div class="video-overlay"></div>
    </div>

    <div class="coming-soon-card" id="fallback-card">
        <div class="rocket-icon">🚀</div>
        <h1>Coming Soon</h1>
        <p>We're launching soon! Our team is putting on the final touches to bring you the ultimate digital fitness hub. Check back soon.</p>
        <div class="status-badge">
            <span class="status-dot"></span>
            Pre-launch phase
        </div>
        <div class="footer-text">
            &copy; 2026 <a href="/">The Dream Gym</a>. All rights reserved.
        </div>
    </div>

    <script>
        var video = document.getElementById('maintenance-video');
        var wrapper = document.getElementById('video-wrapper');
        
        var desktopVideoSrc = "https://res.cloudinary.com/nsqqegj1/video/upload/q_auto,f_auto/v1784749054/coming_soon_dzqqpd.mp4";
        var mobileVideoSrc = "https://res.cloudinary.com/nsqqegj1/video/upload/q_auto,f_auto/v1784749050/coming_soon_mobile_yuxk9x.mp4";
        var currentVideoSrc = "";

        function updateVideoSource() {
            var isPortrait = window.matchMedia("(orientation: portrait)").matches;
            var isMobileOrTab = window.innerWidth <= 1024 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            var newSrc = (isPortrait && isMobileOrTab) ? mobileVideoSrc : desktopVideoSrc;
            
            if (currentVideoSrc !== newSrc) {
                var wasPlaying = !video.paused;
                currentVideoSrc = newSrc;
                video.src = newSrc;
                video.load();
                var playPromise = video.play();
                if (playPromise !== undefined) {
                    playPromise.catch(function(error) { 
                        console.log('Video autoplay prevented'); 
                    });
                }
            }
        }

        window.addEventListener('resize', updateVideoSource);
        updateVideoSource();
    </script>
</body>
</html>
