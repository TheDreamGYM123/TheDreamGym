<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheduled Maintenance - The Dream Gym</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-background: #15130a;
            --color-surface: #222015;
            --color-secondary: #e6d02d;
            --color-outline: #4b4734;
            --color-on-surface: #e8e2d1;
            --color-on-surface-variant: #cdc7ad;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Epilogue', sans-serif;
            background-color: var(--color-background);
            color: var(--color-on-surface);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Responsive Video Wrapper */
        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            background: var(--color-background);
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Overlay to make text readable */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(21, 19, 10, 0.92) 0%, rgba(21, 19, 10, 0.8) 50%, rgba(34, 32, 21, 0.88) 100%);
            z-index: 2;
        }

        /* Header Logos (Always Visible) */
        .header-logos {
            position: absolute;
            top: 24px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            z-index: 10;
            pointer-events: none;
        }

        .header-logos * {
            pointer-events: auto;
        }

        .gym-logo img {
            height: 32px;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
        }

        .as-creates-logo {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            letter-spacing: 0.5px;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .as-creates-logo strong {
            color: var(--color-secondary);
        }

        /* Maintenance Card */
        .maintenance-card {
            position: relative;
            z-index: 3;
            max-width: 500px;
            width: 90%;
            background: rgba(34, 32, 21, 0.75);
            backdrop-filter: blur(16px) saturate(120%);
            -webkit-backdrop-filter: blur(16px) saturate(120%);
            border: 1px solid rgba(75, 71, 52, 0.4);
            padding: 48px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(230, 208, 45, 0.05);
            transition: opacity 0.8s ease, transform 0.8s ease;
            opacity: 1;
            transform: translateY(0);
        }

        .maintenance-card.hidden {
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }

        /* Close Button inside Card */
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: none;
            color: var(--color-on-surface-variant);
            font-size: 24px;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .close-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        .maintenance-icon {
            font-size: 54px;
            color: var(--color-secondary);
            margin-bottom: 24px;
            display: inline-flex;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 16px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            color: var(--color-on-surface-variant);
            margin-bottom: 30px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(230, 208, 45, 0.1);
            border: 1px solid rgba(230, 208, 45, 0.3);
            padding: 8px 16px;
            border-radius: 9999px;
            color: var(--color-secondary);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--color-secondary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--color-secondary);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        .footer-text {
            margin-top: 36px;
            font-size: 12px;
            color: rgba(205, 199, 173, 0.4);
            border-top: 1px solid rgba(75, 71, 52, 0.2);
            padding-top: 24px;
        }

        .footer-text a {
            color: var(--color-secondary);
            text-decoration: none;
            font-weight: 700;
        }

        /* Floating Info Trigger (shows when card is hidden) */
        .info-trigger {
            position: absolute;
            bottom: 24px;
            left: 24px;
            z-index: 10;
            background: rgba(34, 32, 21, 0.85);
            border: 1px solid rgba(75, 71, 52, 0.4);
            color: var(--color-on-surface);
            font-weight: 700;
            font-size: 13px;
            padding: 10px 18px;
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s;
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
        }

        .info-trigger.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .info-trigger:hover {
            border-color: var(--color-secondary);
            color: var(--color-secondary);
        }
    </style>
</head>
<body>
    <div id="video-wrapper" class="video-wrapper">
        <video id="maintenance-video" autoplay loop muted playsinline></video>
        <div class="video-overlay"></div>
    </div>

    <!-- Floating Logos (Always Visible) -->
    <div class="header-logos">
        <div class="gym-logo">
            <img src="/logo.png" alt="The Dream Gym">
        </div>
        <div class="as-creates-logo">
            Maintained by <strong>AS Creates</strong>
        </div>
    </div>

    <div class="maintenance-card" id="fallback-card">
        <button id="close-card-btn" class="close-btn" aria-label="Close Card">&times;</button>
        <div class="maintenance-icon">🛡️</div>
        <h1>We'll be back soon</h1>
        <p>Our website is undergoing scheduled maintenance to upgrade our facilities. We apologize for the delay. Check back in a few minutes.</p>
        <div class="status-badge">
            <span class="status-dot"></span>
            Maintenance in progress
        </div>
        <div class="footer-text">
            &copy; 2026 <a href="/">The Dream Gym</a>. All rights reserved.<br>
            <span style="font-size: 10px; opacity: 0.8; margin-top: 4px; display: block;">Maintained by AS Creates</span>
        </div>
    </div>

    <!-- Info Button to restore card -->
    <button class="info-trigger" id="info-btn">
        <span>🛡️</span> Status Info
    </button>

    <script>
        var video = document.getElementById('maintenance-video');
        var wrapper = document.getElementById('video-wrapper');
        var fallbackCard = document.getElementById('fallback-card');
        var closeBtn = document.getElementById('close-card-btn');
        var infoBtn = document.getElementById('info-btn');
        var hideTimeout;
        
        var desktopVideoSrc = "https://res.cloudinary.com/nsqqegj1/video/upload/q_auto,f_auto/v1784749049/Video_Maintain_u8gk0f.mp4";
        var mobileVideoSrc = "https://res.cloudinary.com/nsqqegj1/video/upload/q_auto,f_auto/v1784749058/Video_Maintain_mobile_nghk1h.mp4";
        var currentVideoSrc = "";

        function updateVideoSource() {
            var isPortrait = window.matchMedia("(orientation: portrait)").matches;
            var isMobileOrTab = window.innerWidth <= 1024 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            var newSrc = (isPortrait && isMobileOrTab) ? mobileVideoSrc : desktopVideoSrc;
            
            if (currentVideoSrc !== newSrc) {
                var wasPlaying = !video.paused;
                currentVideoSrc = newSrc;
                video.src = newSrc;
                video.load();
                var playPromise = video.play();
                if (playPromise !== undefined) {
                    playPromise.catch(function(error) { 
                        console.log('Video autoplay prevented'); 
                    });
                }
            }
        }

        window.addEventListener('resize', updateVideoSource);
        updateVideoSource();

        // Hide / Show card functionality
        function showCard() {
            fallbackCard.classList.remove('hidden');
            infoBtn.classList.remove('visible');
        }

        function hideCard() {
            fallbackCard.classList.add('hidden');
            infoBtn.classList.add('visible');
        }

        closeBtn.addEventListener('click', function() {
            clearTimeout(hideTimeout);
            hideCard();
        });

        infoBtn.addEventListener('click', function() {
            showCard();
        });

        // Auto hide card after 3 seconds
        hideTimeout = setTimeout(hideCard, 3000);
    </script>
</body>
</html>
