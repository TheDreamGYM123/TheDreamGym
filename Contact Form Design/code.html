<style>
        .glass-card {
            background: rgba(34, 32, 21, 0.4);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(150, 145, 122, 0.2);
        }
        .input-glow:focus {
            outline: none;
            border-color: #e6d02d;
            box-shadow: 0 0 10px rgba(230, 208, 45, 0.2);
        }
    </style>

<body class="bg-background text-on-background font-body-lg selection:bg-secondary selection:text-background min-h-screen flex items-center justify-center">
<main class="w-full">
<!-- Contact Section Only -->
<section class="py-section-gap px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto">
<div class="flex justify-center">
<!-- Left Column: Details -->
<!-- Right Column: Form -->
<div class="w-full max-w-2xl">
<div class="glass-card p-10 md:p-16 rounded-xl relative overflow-hidden">
<!-- Decorative glow -->
<div class="absolute -top-24 -right-24 w-64 h-64 bg-secondary/10 rounded-full blur-[100px]"></div>
<form class="relative z-10 space-y-gutter">
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<div class="space-y-2">
<label class="font-label-caps text-[10px] text-on-tertiary-container">FULL NAME</label>
<input class="w-full bg-surface-container-lowest/50 border border-outline-variant/30 rounded-lg p-4 text-on-surface placeholder:text-on-tertiary-container input-glow" placeholder="John Wick" type="text"/>
</div>
<div class="space-y-2">
<label class="font-label-caps text-[10px] text-on-tertiary-container">EMAIL ADDRESS</label>
<input class="w-full bg-surface-container-lowest/50 border border-outline-variant/30 rounded-lg p-4 text-on-surface placeholder:text-on-tertiary-container input-glow" placeholder="Email address" type="email"/>
</div>
</div>
<div class="grid grid-cols-1 gap-gutter">
<div class="space-y-2">
<label class="font-label-caps text-[10px] text-on-tertiary-container">PHONE NUMBER</label>
<input class="w-full bg-surface-container-lowest/50 border border-outline-variant/30 rounded-lg p-4 text-on-surface placeholder:text-on-tertiary-container input-glow" placeholder="+91 000 000 0000" type="tel"/>
</div>
</div>
<div class="space-y-2">
<label class="font-label-caps text-[10px] text-on-tertiary-container">MESSAGE / GOALS</label>
<textarea class="w-full bg-surface-container-lowest/50 border border-outline-variant/30 rounded-lg p-4 text-on-surface placeholder:text-on-tertiary-container input-glow resize-none" placeholder="Tell us about your ultimate fitness objectives..." rows="4"></textarea>
</div>
<button class="w-full bg-secondary text-background font-extrabold py-6 rounded-lg text-lg uppercase tracking-widest hover:brightness-110 active:scale-[0.98] transition-all shadow-[0_0_20px_rgba(230,208,45,0.3)]" type="submit">
                                SUBMIT APPLICATION
                            </button>
<p class="text-center font-body-sm text-body-sm text-on-tertiary-container mt-4 italic">
                                * Selection is based on consultant availability and member alignment.
                            </p>
</form>
</div>
</div>
</div>
</section>
</main>
